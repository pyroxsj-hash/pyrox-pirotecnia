<style>
:root{color-scheme:dark;--bg:#0B0A14;--bg2:#110F1D;--surface:#171427;--surface2:#1F1B33;--line:rgba(255,255,255,.09);--text:#F6F1E7;--text2:#B9B3C9;--text3:#7F7996;--ember:#FF7A1A;--gold:#FFC24D;--magenta:#F0357F;--green:#4ADE80;--red:#FF5A5F;--ease:cubic-bezier(.32,.72,0,1)}

header.top{position:sticky;top:0;z-index:20;background:rgba(11,10,20,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:.5px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 10px}

.sp{flex:1}

.stack{display:flex;flex-direction:column;gap:12px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(17,15,29,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:.5px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:2px}
nav.tabs button{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--text3)}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:94dvh;display:flex;flex-direction:column;background:#151225;border-radius:24px 24px 0 0;box-shadow:0 -10px 50px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .45s var(--ease)}

.x{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:18px;line-height:1}

.mt img{width:100%;height:100%;object-fit:cover}

.mt .cv{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;background:var(--gold);color:#1a0d02;padding:2px 7px;border-radius:999px}
.mt .ac{position:absolute;right:5px;top:5px;display:flex;flex-direction:column;gap:5px}
.mt .ac button{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);font-size:13px;display:grid;place-items:center}
.preview{background:#0d0b18;border-radius:14px;padding:12px;white-space:pre-wrap;font-size:14.5px;line-height:1.4;color:#d9f7e3;box-shadow:inset 0 0 0 .5px var(--line)}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pchip{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(255,194,77,.13);color:var(--gold);font-family:ui-monospace,Menlo,monospace}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:80;transform:translate(-50%,40px);opacity:0;padding:12px 18px;border-radius:999px;background:#2b2644;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:15px;font-weight:500;max-width:92vw;text-align:center;transition:all .4s var(--ease);pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
#toast.err{background:#5a1e24;color:#ffd7d9}
#busy{position:fixed;inset:0;z-index:90;background:rgba(11,10,20,.72);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:600}
#busy.on{display:flex}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.18);border-top-color:var(--gold);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--text3);padding:40px 10px}
.combos{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(74,222,128,.14),rgba(255,194,77,.1))}
.cat{display:grid;gap:10px;grid-template-columns:1fr}
.cat .top{display:flex;gap:8px;align-items:center}
.cat .top input{flex:1}
.dot{width:26px;height:26px;border-radius:50%;flex:none}
input[type=color]{width:42px;height:38px;padding:2px;border-radius:10px;background:var(--bg2);border:0;flex:none}
.note{font-size:13px;color:var(--text3);margin-top:12px}
.linkrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13.5px}
@media (min-width:700px){.sheet{left:50%;right:auto;width:640px;transform:translate(-50%,105%);border-radius:24px 24px 0 0}.sheet.on{transform:translate(-50%,0)}}
#login{position:fixed;inset:0;z-index:120;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
#login.on{display:flex}
#login .box{max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
#login .logo{font-size:34px}
#login p{color:var(--text2);font-size:15px;line-height:1.45}
#login .err{color:var(--red);font-size:14px;min-height:20px}
#gbtn{min-height:44px;display:flex;justify-content:center}
.signout{font-size:13px;color:var(--text3);text-decoration:underline;padding:6px}
</style>

<script>
'use strict';
var S = null, TAB = 'prod', F = { q: '', cat: '', chip: 'all' }, CLOSE_CB = null;
var ICONS = [['torta','Torta'],['bateria','Batería'],['mortero','Mortero'],['canita','Caña voladora'],['giratorio','Giratorio'],['bomba','Petardo / bomba'],['bengala','Bengala / infantil'],['fuente','Fuente / volcán'],['combo','Combo / regalo'],['pedido','A pedido'],['estrella','Estrella']];

/* ---------- utilidades ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return n == null || n === '' ? '—' : '$' + Math.round(n).toLocaleString('es-AR'); }
function cap(s){ s = String(s == null ? '' : s).trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function ref_(p){ return p.precio == null ? null : (p.oferta > 0 ? p.precio : (p.lista > p.precio ? p.lista : null)); }
function pct_(p){ return p.oferta > 0 ? p.oferta : (ref_(p) ? Math.round((1 - p.precio / p.lista) * 100) : 0); }
function final_(p){ return p.precio == null ? null : (p.oferta > 0 ? Math.round(p.precio * (1 - p.oferta / 100)) : p.precio); }
function thumb(id, w){ return 'https://lh3.googleusercontent.com/d/' + id + '=w' + (w || 300); }
function vthumb(id, w){ return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + (w || 300); }
var API = 'https://script.google.com/macros/s/AKfycbyg0jqQ5yYkTWRTwbm0_BIlA-ylDhYorCzhQ7CmyqV71bxTyGZQin4mZjF4T4IgJr-ttg/exec';
var CLIENT_ID = '801912406537-ab8ijt5r1easq506befk4j34b1ae8j98.apps.googleusercontent.com';
var TOKEN = '', waiters = [], gsiOk = false;
try { TOKEN = sessionStorage.getItem('pyrox_tk') || ''; } catch(e){}
function tokenOk(t){
  try { var p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return p.exp * 1000 > Date.now() + 60000; } catch(e){ return false; }
}
function showLogin(msg){
  $('#login').classList.add('on'); $('#login-err').textContent = msg || '';
  if(gsiOk){ try { google.accounts.id.prompt(); } catch(e){} }
}
function onCred(resp){
  TOKEN = resp.credential;
  try { sessionStorage.setItem('pyrox_tk', TOKEN); } catch(e){}
  $('#login').classList.remove('on');
  var w = waiters; waiters = []; w.forEach(function(f){ f(); });
  if(!S) start();
}
function gsiReady(){
  gsiOk = true;
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCred, auto_select: true, cancel_on_tap_outside: false });
  google.accounts.id.renderButton($('#gbtn'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'es', width: 280 });
  if(!tokenOk(TOKEN)){ showLogin(''); }
}
function ensureLogin(){
  if(tokenOk(TOKEN)) return Promise.resolve();
  return new Promise(function(ok){ waiters.push(ok); showLogin('Tu sesión venció. Volvé a ingresar.'); });
}
function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return ensureLogin().then(function(){
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: TOKEN, action: fn, args: args }) });
  }).then(function(r){ return r.json(); }).then(function(j){
    if(!j.ok){
      if(/^auth:/.test(j.error)){ TOKEN = ''; try { sessionStorage.removeItem('pyrox_tk'); } catch(e){} showLogin(j.error.slice(5)); }
      throw new Error(j.error.replace(/^auth:/, ''));
    }
    return j.data;
  }, function(){ throw new Error('No hay conexión con el servidor. Revisá tu internet.'); });
}
$('#btn-out').onclick = function(){
  TOKEN = ''; S = null; try { sessionStorage.removeItem('pyrox_tk'); } catch(e){}
  try { google.accounts.id.disableAutoSelect(); } catch(e){}
  $('#view').innerHTML = ''; showLogin('');
};
var tt;
function toast(msg, err){ var t = $('#toast'); t.textContent = msg; t.className = 'on' + (err ? ' err' : ''); clearTimeout(tt); tt = setTimeout(function(){ t.className = ''; }, err ? 5200 : 2600); }
function busy(on, txt){ $('#busy').classList.toggle('on', !!on); if(txt) $('#busy-t').textContent = txt; }
async function run(label, fn){
  busy(true, label);
  try { return await fn(); }
  catch(e){ toast(e.message || 'Algo salió mal', true); throw e; }
  finally { busy(false); }
}
function infoBox(msg){
  return new Promise(function(res){
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px';
    d.innerHTML = '<div class="card" style="max-width:420px;width:100%;max-height:80vh;overflow:auto"><p style="font-size:15px;line-height:1.5;margin-bottom:16px">' + msg + '</p><button class="btn primary" style="width:100%">Entendido</button></div>';
    d.addEventListener('click', function(e){ if(e.target === d || e.target.tagName === 'BUTTON'){ d.remove(); res(); } });
    document.body.appendChild(d);
  });
}
function confirmBox(msg, okLabel, danger){
  return new Promise(function(res){
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px';
    d.innerHTML = '<div class="card" style="max-width:380px;width:100%"><p style="font-size:16px;margin-bottom:16px">' + msg + '</p><div class="row"><button class="btn" data-r="0" style="flex:1">Cancelar</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" data-r="1" style="flex:1">' + esc(okLabel || 'Aceptar') + '</button></div></div>';
    d.addEventListener('click', function(e){ var b = e.target.closest('[data-r]'); if(b){ d.remove(); res(b.dataset.r === '1'); } else if(e.target === d){ d.remove(); res(false); } });
    document.body.appendChild(d);
  });
}

/* ---------- hoja inferior (editor) ---------- */
function openSheet(title, body, foot, onClose){
  $('#sheet-title').textContent = title;
  $('#sheet-body').innerHTML = body;
  $('#sheet-foot').innerHTML = foot || '';
  $('#sheet-foot').style.display = foot ? 'flex' : 'none';
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
  CLOSE_CB = onClose || null;
  $('#sheet-body').scrollTop = 0;
}

$('#scrim').addEventListener('click', closeSheet);

/* ================= PRODUCTOS ================= */
function stockTag(p){
  if(p.tipo === 'A pedido') return '<span class="tag warn">A pedido</span>';
  if(p.cantidad == null) return '<span class="tag warn">Stock sin cargar</span>';
  if(p.cantidad === 0) return '<span class="tag bad">Sin stock</span>';
  return '<span class="tag ok">Stock ' + p.cantidad + '</span>';
}
function viewProd(){
  var cats = S.categorias.map(function(c){ return c.nombre; });
  var q = F.q.toLowerCase();
  var list = S.productos.filter(function(p){
    if(q && (p.nombre + ' ' + p.categoria).toLowerCase().indexOf(q) < 0) return false;
    if(F.cat && p.categoria !== F.cat) return false;
    if(F.chip === 'of') return pct_(p) > 0;
    if(F.chip === 'np') return p.precio == null;
    if(F.chip === 'ss') return p.tipo !== 'A pedido' && p.cantidad === 0;
    if(F.chip === 'oc') return !p.visible;
    return true;
  });
  var cnt = { of: 0, np: 0, ss: 0, oc: 0 };
  S.productos.forEach(function(p){ if(pct_(p) > 0) cnt.of++; if(p.precio == null) cnt.np++; if(p.tipo !== 'A pedido' && p.cantidad === 0) cnt.ss++; if(!p.visible) cnt.oc++; });
  var chip = function(k, t){ return '<button class="chip" data-chip="' + k + '" aria-pressed="' + (F.chip === k) + '">' + t + '</button>'; };
  var h = '<div class="row" style="margin-bottom:10px"><div style="flex:1"><h2>Productos</h2><div class="hint">' + S.productos.length + ' en total · tocá uno para editarlo</div></div><button class="btn primary" id="p-new" type="button">＋ Nuevo</button></div>' +
    '<div class="stack" style="margin-bottom:12px"><input type="search" id="p-q" placeholder="Buscar producto…" value="' + esc(F.q) + '">' +
    '<select id="p-cat"><option value="">Todas las categorías</option>' + cats.map(function(c){ return '<option' + (F.cat === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>' +
    '<div class="chips">' + chip('all', 'Todos') + chip('of', 'Ofertas (' + cnt.of + ')') + chip('np', 'Sin precio (' + cnt.np + ')') + chip('ss', 'Sin stock (' + cnt.ss + ')') + chip('oc', 'Ocultos (' + cnt.oc + ')') + '</div></div>';
  if(!list.length) h += '<div class="empty">No hay productos con ese filtro.</div>';
  else h += '<div class="list">' + list.map(function(p){
    var f = final_(p);
    var img = p.fotos[0] ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + thumb(p.fotos[0], 160) + '" alt="">' : (p.videos[0] ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + vthumb(p.videos[0], 160) + '" alt="">' : 'sin foto');
    return '<div class="prod' + (p.visible ? '' : ' off') + '" data-id="' + esc(p.id) + '">' +
      '<div class="th">' + img + '</div>' +
      '<div class="info"><b>' + esc(cap(p.nombre)) + '</b><small>' + esc(p.categoria) + '</small><div class="tags">' + stockTag(p) + (pct_(p) > 0 ? '<span class="tag of">Oferta −' + pct_(p) + '%</span>' : '') + (!p.carpeta ? '<span class="tag">Sin carpeta</span>' : '') + (!p.visible && p.carpeta && p.precio == null ? '<span class="tag warn">Nuevo desde Drive</span>' : '') + (p.precio == null ? '<span class="tag bad">Sin precio</span>' : '') + (p.videos.length ? '<span class="tag">▶ video</span>' : '') + '</div></div>' +
      '<div class="price">' + (ref_(p) != null ? '<s>' + money(ref_(p)) + '</s>' : '') + (f == null ? '' : money(f)) + '</div>' +
      '<button class="sw" role="switch" aria-checked="' + p.visible + '" aria-label="Visible en la tienda" data-vis="' + esc(p.id) + '"></button></div>';
  }).join('') + '</div>';
  $('#view').innerHTML = h;
  $('#p-new').onclick = function(){ editProduct(null); };
  $('#p-q').oninput = function(e){ F.q = e.target.value; var pos = e.target.selectionStart; viewProd(); var i = $('#p-q'); i.focus(); i.setSelectionRange(pos, pos); };
  $('#p-cat').onchange = function(e){ F.cat = e.target.value; viewProd(); };

/* ---------- subida de archivos (por pedazos) ---------- */
function loadImage(file){
  return new Promise(function(ok, no){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){ ok({ img: img, url: url }); };
    img.onerror = function(){ URL.revokeObjectURL(url); no(new Error('No pude leer la imagen. Si es HEIC, subila a la carpeta de Drive o sacale la foto en JPG.')); };
    img.src = url;
  });
}
async function shrink(file, max, q){
  var li = await loadImage(file), img = li.img;
  var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
  var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(li.url);
  return await new Promise(function(ok, no){ c.toBlob(function(b){ b ? ok(b) : no(new Error('No pude achicar la foto.')); }, 'image/jpeg', q); });
}
function toB64(blob){
  return new Promise(function(ok, no){ var r = new FileReader(); r.onload = function(){ ok(String(r.result).split(',')[1] || ''); }; r.onerror = function(){ no(new Error('No pude leer el archivo.')); }; r.readAsDataURL(blob); });
}
async function uploadOne(p, file, n, total){
  var prog = function(t){ var e = $('#f-prog'); if(e) e.textContent = t; };
  var blob = file, name = file.name || 'archivo', mime = file.type || 'application/octet-stream';
  var isImg = mime.indexOf('image/') === 0, isVid = mime.indexOf('video/') === 0;
  if(!isImg && !isVid) throw new Error('Solo se pueden subir fotos o videos.');
  if(isImg && mime !== 'image/gif'){ prog('Achicando foto ' + n + '/' + total + '…'); blob = await shrink(file, 1800, 0.86); mime = 'image/jpeg'; name = name.replace(/\.[^.]+$/, '') + '.jpg'; }
  if(blob.size > 15 * 1024 * 1024) throw new Error('"' + name + '" pesa ' + (blob.size / 1048576).toFixed(1) + ' MB. Subilo directo a la carpeta de Drive y tocá Sincronizar.');
  var b64 = await toB64(blob);
  var sid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  var CH = 1200000, parts = Math.max(1, Math.ceil(b64.length / CH));
  for(var i = 0; i < parts; i++){
    prog('Subiendo ' + n + '/' + total + ' · ' + Math.round((i / parts) * 100) + '%');
    await call('api_uploadChunk', sid, i, b64.slice(i * CH, (i + 1) * CH));
  }
  prog('Guardando en Drive…');
  var r = await call('api_uploadFinish', p.id, sid, parts, name, mime, blob.size);
  S = r.estado; render();
}

        '<input type="text" data-k="subtitulo" value="' + esc(c.subtitulo) + '" placeholder="Frase corta (ej: Efectos en cadena)" aria-label="Subtítulo">' +
        '<div class="row"><select data-k="icono" aria-label="Ícono" style="flex:1">' + ICONS.map(function(ic){ return '<option value="' + ic[0] + '"' + (ic[0] === c.icono ? ' selected' : '') + '>' + ic[1] + '</option>'; }).join('') + '</select><input type="color" data-k="color" value="' + esc(c.color) + '" aria-label="Color">' +
        '<button class="btn sm" data-up type="button" aria-label="Subir">↑</button><button class="btn sm" data-down type="button" aria-label="Bajar">↓</button><button class="btn sm danger" data-rm type="button" aria-label="Quitar">🗑</button></div></div>';
    }).join('') + '</div>' +
    '<div class="row" style="margin-top:14px"><button class="btn" id="c-add" type="button">＋ Agregar categoría</button><div class="sp" style="flex:1"></div><button class="btn primary" id="c-save" type="button">Guardar categorías</button></div>';
  $('#view').innerHTML = h;
  $('#c-combos').onclick = async function(){
    var on = !(combos && combos.visible);
    if(!combos){ CATS.push({ anterior: '', nombre: 'Combos', subtitulo: 'Todo armado', icono: 'combo', color: '#4ADE80', visible: on }); } else combos.visible = on;
    await saveCats(on ? 'Sección Combos activada' : 'Sección Combos desactivada');
  };
  $('#c-add').onclick = function(){ readCatInputs(); CATS.push({ anterior: '', nombre: 'Nueva categoría', subtitulo: '', icono: 'estrella', color: '#FFC24D', visible: true }); viewCat(); };
  $('#c-save').onclick = function(){ readCatInputs(); saveCats('Categorías guardadas'); };
  [].forEach.call(document.querySelectorAll('.cat'), function(el){
    var i = +el.dataset.i;
    el.querySelector('[data-k=visible]').onclick = function(){ readCatInputs(); CATS[i].visible = !CATS[i].visible; viewCat(); };
    el.querySelector('[data-up]').onclick = function(){ readCatInputs(); if(i > 0){ var t = CATS[i]; CATS[i] = CATS[i - 1]; CATS[i - 1] = t; viewCat(); } };
    el.querySelector('[data-down]').onclick = function(){ readCatInputs(); if(i < CATS.length - 1){ var t = CATS[i]; CATS[i] = CATS[i + 1]; CATS[i + 1] = t; viewCat(); } };
    el.querySelector('[data-rm]').onclick = async function(){
      readCatInputs();
      var n = S.productos.filter(function(p){ return p.categoria === CATS[i].anterior; }).length;
      if(n){ toast('"' + CATS[i].nombre + '" tiene ' + n + ' producto(s). Movelos a otra categoría o ocultala con el interruptor.', true); return; }
      if(!(await confirmBox('¿Quitar la categoría <b>' + esc(CATS[i].nombre) + '</b>?', 'Quitar', true))) return;
      CATS.splice(i, 1); await saveCats('Categoría quitada');
    };
    el.querySelector('[data-k=color]').oninput = function(e){ el.querySelector('.dot').style.background = e.target.value; };
  });
}
function readCatInputs(){
  [].forEach.call(document.querySelectorAll('.cat'), function(el){
    var i = +el.dataset.i, c = CATS[i]; if(!c) return;
    c.nombre = el.querySelector('[data-k=nombre]').value.trim(); c.subtitulo = el.querySelector('[data-k=subtitulo]').value.trim();
    c.icono = el.querySelector('[data-k=icono]').value; c.color = el.querySelector('[data-k=color]').value;
  });
}
async function saveCats(msg){
  try { S = await run('Guardando…', function(){ return call('api_saveCategories', CATS); }); CATS = null; render(); toast(msg); } catch(e){ render(); }
}

/* ================= MENSAJES ================= */
var MSG_SAMPLE = { productos: '• 2 x Batería 50 tiros — $24.000\n• 1 x Torta 36 tiros (a pedido) — $18.000', total: '$42.000', cantidad: '2', producto: 'Batería 50 tiros', nota: '', precio: '$12.000', subtotal: '$24.000', oferta: '−10%', nombre: 'Juan Pérez', contacto: '264 555-1234', mensaje: 'Quiero algo para el cierre de una fiesta de 15 años.' };
function fill(tpl, v){ return String(tpl).replace(/\{(\w+)\}/g, function(m, k){ return v[k] !== undefined ? v[k] : m; }); }
var MSGS = [
  { k: 'mensaje_pedido', t: 'Mensaje del pedido (carrito)', d: 'Es lo que se manda por WhatsApp cuando alguien termina su pedido.', ch: ['productos', 'total'], rows: 7 },
  { k: 'formato_linea', t: 'Formato de cada producto del pedido', d: 'Se repite una vez por producto y se pega en {productos}.', ch: ['cantidad', 'producto', 'nota', 'precio', 'subtotal', 'oferta'], rows: 2 },
  { k: 'mensaje_contacto', t: 'Mensaje del formulario “Contacto”', d: 'Lo que se manda cuando alguien completa el formulario de contacto.', ch: ['nombre', 'contacto', 'mensaje'], rows: 5 },
  { k: 'mensaje_consulta', t: 'Mensaje de “Consultar” un producto', d: 'Se usa en los productos sin precio y en el botón de consulta.', ch: ['producto'], rows: 3 }
];
function viewMsg(){
  var h = '<h2>Mensajes de WhatsApp</h2><div class="hint" style="margin-bottom:12px">Tocá una palabra entre llaves para insertarla donde tengas el cursor. Abajo ves cómo queda.</div><div class="stack">' +
    MSGS.map(function(m){
      return '<div class="card"><label class="l" for="m-' + m.k + '" style="font-size:14px;color:var(--text)">' + m.t + '</label><div class="hint" style="margin-bottom:8px">' + m.d + '</div>' +
        '<textarea id="m-' + m.k + '" rows="' + m.rows + '" style="min-height:0">' + esc(S.ajustes[m.k]) + '</textarea>' +
        '<div class="pchips">' + m.ch.map(function(c){ return '<button type="button" class="pchip" data-ins="' + m.k + '" data-v="{' + c + '}">{' + c + '}</button>'; }).join('') + '</div>' +
        '<div class="hint" style="margin:8px 0 4px">Vista previa</div><div class="preview" id="pv-' + m.k + '"></div>' +
        '<button type="button" class="btn sm" style="margin-top:10px" data-reset="' + m.k + '">Restaurar el original</button></div>';
    }).join('') + '<button class="btn primary" id="m-save" type="button">Guardar mensajes</button></div>';
  $('#view').innerHTML = h;
  function pv(){
    var line = fill($('#m-formato_linea').value, MSG_SAMPLE);
    var v = Object.assign({}, MSG_SAMPLE, { productos: line + '\n' + line.replace('2', '1').replace('Batería 50 tiros', 'Torta 36 tiros') });
    MSGS.forEach(function(m){
      var val = $('#m-' + m.k).value;
      $('#pv-' + m.k).textContent = m.k === 'formato_linea' ? fill(val, MSG_SAMPLE) : fill(val, v);
    });
  }
  MSGS.forEach(function(m){ $('#m-' + m.k).oninput = pv; });
  [].forEach.call(document.querySelectorAll('[data-ins]'), function(b){ b.onclick = function(){
    var ta = $('#m-' + b.dataset.ins), s = ta.selectionStart == null ? ta.value.length : ta.selectionStart, e = ta.selectionEnd == null ? s : ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + b.dataset.v + ta.value.slice(e); ta.focus(); ta.setSelectionRange(s + b.dataset.v.length, s + b.dataset.v.length); pv();
  }; });
  [].forEach.call(document.querySelectorAll('[data-reset]'), function(b){ b.onclick = function(){ $('#m-' + b.dataset.reset).value = S.defaults[b.dataset.reset]; pv(); }; });
  $('#m-save').onclick = async function(){
    var o = {}; MSGS.forEach(function(m){ o[m.k] = $('#m-' + m.k).value; });
    if(o.mensaje_pedido.indexOf('{productos}') < 0 && !(await confirmBox('El mensaje del pedido no incluye <b>{productos}</b>: no se vería qué pidió la persona. ¿Guardar igual?', 'Guardar igual'))) return;
    try { S = await run('Guardando…', function(){ return call('api_saveSettings', o); }); render(); toast('Mensajes guardados'); } catch(e){}
  };
  pv();
}

/* ================= NEGOCIO ================= */
function viewBiz(){
  var a = S.ajustes;
  $('#view').innerHTML = '<h2>Datos del negocio</h2><div class="hint" style="margin-bottom:12px">Se muestran en la sección Contacto de la tienda y en los botones de WhatsApp.</div><div class="stack">' +
    '<div class="card stack"><div><label class="l" for="b-wa">WhatsApp (con código de país, solo números)</label><input type="tel" id="b-wa" inputmode="numeric" value="' + esc(a.whatsapp) + '" placeholder="5492646063960"><div class="hint" style="margin-top:4px">Argentina celular: 549 + característica + número (sin 0 ni 15).</div></div>' +
    '<div><label class="l" for="b-mail">Email</label><input type="email" id="b-mail" value="' + esc(a.email) + '"></div>' +
    '<div><label class="l" for="b-ig">Instagram (usuario)</label><input type="text" id="b-ig" value="' + esc(a.instagram) + '" placeholder="pyrox_sj"></div>' +
    '<div><label class="l" for="b-hor">Horarios</label><input type="text" id="b-hor" value="' + esc(a.horarios) + '" placeholder="8 a 22 h"></div></div>' +
    '<div class="card"><div class="row"><div style="flex:1"><b>Ocultar productos sin stock</b><div class="hint">Si está apagado, aparecen con la etiqueta “Sin stock”.</div></div><button class="sw" id="b-ss" role="switch" aria-checked="' + (a.ocultar_sin_stock === 'SÍ') + '" type="button"></button></div></div>' +
    '<button class="btn primary" id="b-save" type="button">Guardar datos</button>' +
    '<div class="card"><b>Accesos</b><div class="linkrow"><a href="' + esc(S.sheetUrl) + '" target="_blank" rel="noopener">Abrir la hoja de cálculo</a><a href="' + esc(S.rootUrl) + '" target="_blank" rel="noopener">Abrir la carpeta de fotos y videos</a><a href="' + esc(S.siteUrl) + '" target="_blank" rel="noopener">Ver la tienda</a></div>' +
    '<div class="note">Cuando guardás algo acá, la hoja se actualiza al instante y la tienda lo muestra en unos minutos (Google refresca la hoja publicada cada ~5 minutos).</div></div></div>';
  $('#b-ss').onclick = function(){ this.setAttribute('aria-checked', this.getAttribute('aria-checked') !== 'true'); };
  $('#b-save').onclick = async function(){
    var o = { whatsapp: $('#b-wa').value, email: $('#b-mail').value.trim(), instagram: $('#b-ig').value.trim(), horarios: $('#b-hor').value.trim(), ocultar_sin_stock: $('#b-ss').getAttribute('aria-checked') === 'true' ? 'SÍ' : 'NO' };
    try { S = await run('Guardando…', function(){ return call('api_saveSettings', o); }); render(); toast('Datos guardados'); } catch(e){}
  };
}

/* ================= SINCRONIZAR / ARRANQUE ================= */
$('#btn-sync').onclick = async function(){
  try {
    var r = await run('Leyendo la carpeta de Drive…', function(){ return call('api_sync'); });
    S = r.estado; CATS = null; render();
    var q = r.resumen, extra = [];
    if(q.nuevosOcultos && q.nuevosOcultos.length) extra.push('<b>Carpetas de Drive sin producto en la hoja</b> (se crearon ocultas, completales el precio o borralas):<br>' + q.nuevosOcultos.map(esc).join(', '));
    if(q.sinCarpeta && q.sinCarpeta.length) extra.push('<b>Productos de la hoja sin carpeta en Drive</b> (no tienen fotos; podés vincularlos desde su ficha):<br>' + q.sinCarpeta.map(function(x){ return esc(cap(x)); }).join(', '));
    toast('Listo: ' + q.productos + ' productos · ' + q.vinculados + ' vinculados con Drive');
    if(extra.length) await infoBox(extra.join('<br><br>'));
  } catch(e){}
};
async function start(){
  render();
  try { S = await call('api_bootstrap'); render(); }
  catch(e){ if(!/sesi|ingres|cuenta/i.test(e.message)) $('#view').innerHTML = '<div class="empty">No pude cargar el panel.<br>' + esc(e.message) + '<br><br><button class="btn" onclick="start()">Reintentar</button></div>'; }
}
if(tokenOk(TOKEN)) start(); else { render(); }
if('serviceWorker' in navigator && location.protocol === 'https:'){ addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
